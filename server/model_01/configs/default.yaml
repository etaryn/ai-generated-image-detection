# Default configuration for the AIGC detector.
# Override any of these on the command line, e.g.:
#   python train.py --config configs/default.yaml --model.backbone_name ViT-L-14

data:
  # Where prepare_data.py lays out each dataset:
  #   data/raw/<dataset_name>/real/*.jpg
  #   data/raw/<dataset_name>/fake/*.jpg
  # "synthetic" (data/make_synthetic_dataset.py) is a network-free stand-in for
  # smoke-testing the pipeline before real data is downloaded/laid out -- swap
  # in "sid_set"/"cifake"/"wildfake" for an actual training run.
  train_datasets: ["sid_set", "cifake"]     # + "wildfake" if compute allows
  val_split: 0.1                             # held out from train_datasets (in-distribution val)
  image_size: 224
  batch_size: 64
  num_workers: 8

  # NOTE: the WildFake COCO/DALL-E "Validation Dataset" from the challenge brief is
  # demonstration-only and must NOT appear in train_datasets or val_split above.
  demo_eval_set:
    real_dir: "data/raw/wildfake_demo/coco_val2017"
    fake_dir: "data/raw/wildfake_demo/dalle_advanced"

augmentation:
  # Probabilities are independent per-sample; transforms can stack, matching the
  # challenge's "subset of the following augmentations" robustness framing.
  jpeg:
    prob: 0.5
    qualities: [90, 70, 50, 30]
  gaussian_blur:
    prob: 0.4
    sigmas: [0.5, 1.0, 2.0]
  resize_roundtrip:
    prob: 0.4
    scales: [0.5, 0.25]
  gaussian_noise:
    prob: 0.4
    sigmas: [0.02, 0.05, 0.10]
  color_jitter:
    prob: 0.4
    max_delta: 0.20        # +/-20% brightness / contrast / saturation
  center_crop:
    prob: 0.3
    crop_fraction: 0.80

model:
  # Team decision: CNN + Transformer hybrid is the primary architecture.
  # "clip_frozen" (frozen CLIP backbone + linear head) is kept as an alternative/
  # baseline you can switch back to by changing this one field.
  architecture: "cnn_transformer"   # "cnn_transformer" | "clip_frozen"
  input_image_size: 224

  cnn_transformer:
    # ConvStem: 4 stride-2 stages -> 224/16 = 14x14 grid of feature vectors.
    stem_channels: [64, 128, 256, 384]
    # TokenTransformer: standard multi-head self-attention encoder over the
    # CNN's local feature tokens (+ a learnable [CLS] token for pooling).
    transformer_dim: 384
    transformer_depth: 6
    transformer_heads: 6
    transformer_mlp_ratio: 4.0
    dropout: 0.1
    # Trainable end-to-end (no frozen component) -> total params ~14M,
    # far under the challenge's 2B limit, but expect to need more epochs/data
    # than the frozen-backbone baseline since there's no pretraining to lean on.

  clip_frozen:
    backbone_name: "ViT-B-16"     # or "ViT-L-14" if compute allows; both well under 2B params
    pretrained: "openai"          # open_clip pretrained tag
    freeze_backbone: true

  use_freq_branch: false        # set true to enable the optional DCT/FFT fusion branch
  head_hidden_dim: 256
  head_dropout: 0.2

train:
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  consistency_loss_weight: 0.5   # weight on clean-vs-augmented logit consistency loss
  checkpoint_dir: "checkpoints/"
  log_every: 50
  seed: 42

eval:
  threshold: 0.5                 # decision threshold; see error_analysis for FPR-budget calibration
  severities: ["clean", "mild", "moderate", "severe"]
  output_dir: "eval/outputs/"
