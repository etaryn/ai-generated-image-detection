# SMOKE-TEST config using the network-free synthetic dataset (data/make_synthetic_dataset.py)
# instead of CIFAKE, since no dataset credentials/download are set up yet.
# Same as quick_smoke.yaml otherwise. Usage:
#   python data/make_synthetic_dataset.py --out data/raw/synthetic --n_per_class 200
#   python train.py --config configs/smoke_synthetic.yaml

data:
  train_datasets: ["synthetic"]
  val_split: 0.1
  image_size: 64
  batch_size: 64
  num_workers: 4

  demo_eval_set:
    real_dir: "data/raw/wildfake_demo/coco_val2017"
    fake_dir: "data/raw/wildfake_demo/dalle_advanced"

augmentation:
  jpeg:
    prob: 0.5
    qualities: [90, 70, 50, 30]
  gaussian_blur:
    prob: 0.4
    sigmas: [0.5, 1.0, 2.0]
  resize_roundtrip:
    prob: 0.4
    scales: [0.5, 0.25]
  gaussian_noise:
    prob: 0.4
    sigmas: [0.02, 0.05, 0.10]
  color_jitter:
    prob: 0.4
    max_delta: 0.20
  center_crop:
    prob: 0.3
    crop_fraction: 0.80

model:
  architecture: "cnn_transformer"
  input_image_size: 64

  cnn_transformer:
    stem_channels: [64, 128, 256, 384]
    transformer_dim: 384
    transformer_depth: 6
    transformer_heads: 6
    transformer_mlp_ratio: 4.0
    dropout: 0.1

  clip_frozen:
    backbone_name: "ViT-B-16"
    pretrained: "openai"
    freeze_backbone: true

  use_freq_branch: false
  head_hidden_dim: 256
  head_dropout: 0.2

train:
  epochs: 2
  lr: 1.0e-3
  weight_decay: 1.0e-4
  consistency_loss_weight: 0.5
  checkpoint_dir: "checkpoints_smoke/"
  log_every: 50
  seed: 42

eval:
  threshold: 0.5
  severities: ["clean", "mild", "moderate", "severe"]
  output_dir: "eval/outputs/"
